name: Enrichment MCP Tests

on:
  push:
    paths:
      - 'mcp/data-enrichment/**'
      - '.github/workflows/mcp-tests.yml'
  pull_request:
    paths:
      - 'mcp/data-enrichment/**'
      - '.github/workflows/mcp-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/data-enrichment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -c "from mcp.server.fastmcp import FastMCP; from mcp_server import create_mcp; print('MCP import OK')"
      - run: pytest -q
