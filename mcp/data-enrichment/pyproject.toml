[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "data-enrichment-mcp"
version = "0.1.0"
description = "Free-first, provider-agnostic web enrichment engine"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "ddgs>=9,<10"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
